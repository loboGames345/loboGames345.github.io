<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo World - Inicio</title>
    <style>
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
        }
        
        header { 
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(135deg, #1a0b2e, #0a0a0a); 
            border-bottom: 2px solid #6c5ce7; 
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }
        h1 { 
            margin: 0; 
            font-size: 3.5em; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 0 0 15px #6c5ce7; 
        }
        p.subtitle { color: #a29bfe; font-size: 1.2em; margin-top: 10px; }
        
        .games-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 40px; 
            padding: 60px 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .game-card { 
            background-color: #1e1e24; 
            border-radius: 15px; 
            overflow: hidden; 
            width: 320px; 
            transition: all 0.4s ease; 
            border: 1px solid #333;
        }
        
        .game-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.4); 
            border-color: #6c5ce7;
        }
        
        .game-image { 
            height: 200px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold; 
            font-size: 1.8em; 
            color: rgba(255,255,255,0.7);
            letter-spacing: 2px;
        }
        
        .game-info { padding: 25px; text-align: center; }
        .game-info h2 { margin: 0 0 15px; font-size: 1.8em; }
        .game-info p { color: #b2bec3; font-size: 1em; margin-bottom: 25px; line-height: 1.5; }
        
        .play-btn { 
            display: inline-block; 
            padding: 12px 30px; 
            background-color: #6c5ce7; 
            color: white; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s, transform 0.2s; 
        }
        .play-btn:hover { 
            background-color: #a29bfe; 
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Lobo World</h1>
        <p class="subtitle">Juegos y más</p>
    </header>

    <main class="games-container">
        
        <div class="game-card">

            <div class="game-image">
                <img src="portada_stickfighters.jpg" alt="Stick Fighters Batalla Épica" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="game-info">
                <h2>Stick Fighters</h2>
                <p>Demuestra que eres el mejor Stickman. Pelea contra rivales listos para ganarte.</p>
                
                <a href="Stick_Fighters/index.html" class="play-btn">Jugar Ahora</a>
            </div>
        </div>

        <div class="game-card">
            
            <div class="game-image" style="background: linear-gradient(45deg, #0f2027, #203a43, #2c5364);">
                Cargando...
            </div>
            <div class="game-info">
                <h2>Próximamente...</h2>
                <p>Juego aun en desarrollo...</p>
                <a href="#" class="play-btn" style="background-color: #555;">Próximamente</a>
            </div>
        </div>

    </main>

</body>
</html>
